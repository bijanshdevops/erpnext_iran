# Public demo of ERPNext Iran (erp.greenlanco.ir): ERPNext + Frappe HR + erpnext_iran with sample
# data, a guest user, and a reset to the first state every RESET_HOURS. See demo/README.md.
#
#   cp demo/demo.env.example demo/demo.env && nano demo/demo.env
#   docker compose -f demo/compose.demo.yml --env-file demo/demo.env up -d
#
# The frontend joins the website's network (SITE_NETWORK) as erpnext-demo-frontend, where the
# website's nginx sends erp.greenlanco.ir; it is also on 127.0.0.1:DEMO_PORT for checks.

x-image: &image
  image: ghcr.io/bijanshdevops/erpnext_iran:${IMAGE_TAG:-v15}
  restart: unless-stopped

x-backend: &backend
  <<: *image
  volumes:
    - sites:/home/frappe/frappe-bench/sites
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in demo.env}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 30

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue:/data

  configurator:
    <<: *image
    restart: on-failure
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://redis-cache:6379;
        bench set-config -g redis_queue redis://redis-queue:6379;
        bench set-config -g redis_socketio redis://redis-queue:6379;
        bench set-config -gp socketio_port 9000;
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend

  websocket:
    <<: *backend
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  worker:
    <<: *backend
    command: ["bench", "worker", "--queue", "short,default,long"]

  frontend:
    <<: *image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE:-erp.greenlanco.ir}
      UPSTREAM_REAL_IP_ADDRESS: 172.16.0.0/12
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      CLIENT_MAX_BODY_SIZE: 10m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    ports:
      - "127.0.0.1:${DEMO_PORT:-3400}:8080"
    depends_on: [backend, websocket]
    networks:
      default:
      site:
        aliases: [erpnext-demo-frontend]

  # creates the site with the demo data on first start, then puts it back every RESET_HOURS
  demo-reset:
    <<: *backend
    entrypoint: ["bash", "/home/frappe/frappe-bench/apps/erpnext_iran/demo/run.sh"]
    environment:
      SITE: ${SITE:-erp.greenlanco.ir}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in demo.env}
      DEMO_USER: ${DEMO_USER:-demo@greenlanco.ir}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1405}
      RESET_HOURS: ${RESET_HOURS:-6}
    volumes:
      - sites:/home/frappe/frappe-bench/sites

volumes:
  db:
  redis-queue:
  sites:

networks:
  site:
    name: ${SITE_NETWORK:-greenlanco_internal}
    external: true
